<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — BrandPulse</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>body{margin:0;background:#060708;color:#f3f5f6;font-family:Inter,sans-serif;min-height:100vh;display:grid;place-items:center}.box{width:min(420px,calc(100% - 40px));border:1px solid #20252a;background:#101316;border-radius:18px;padding:38px;box-shadow:0 24px 70px #0008}.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;margin-bottom:44px}.mark{width:24px;height:24px;border-radius:7px;background:#c9f25a}.ey{font-size:11px;letter-spacing:2px;color:#c9f25a;font-weight:700}.title{font-size:32px;letter-spacing:-1px;margin:10px 0}.sub{color:#7e8790;line-height:1.6;margin-bottom:28px}.google{width:100%;height:48px;border:1px solid #30363b;background:#fff;color:#111;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px}.status{margin-top:18px;color:#7e8790;font-size:12px;min-height:18px}.small{margin-top:28px;font-size:11px;color:#596169;line-height:1.5}</style></head><body><main class="box"><div class="logo"><span class="mark"></span>BRANDPULSE</div><div class="ey">AUTONOMOUS BRAND INTELLIGENCE</div><h1 class="title">Sign in to your workspace</h1><p class="sub">Use Google to access missions, brand memory, analytics and agent execution history.</p><button id="google" class="google">Continue with Google</button><div id="status" class="status"></div><div class="small">Google sign-in uses Firebase Authentication. For a local hackathon demo, the same button opens the app in Demo mode until Firebase is configured.</div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import{firebaseConfig}from'./auth/firebase-config.js';const status=document.getElementById('status');const configured=firebaseConfig.apiKey&&firebaseConfig.apiKey!=='YOUR_API_KEY';if(!configured){status.textContent='Firebase is not configured. Demo sign-in is available.';document.getElementById('google').onclick=()=>{localStorage.setItem('brandpulse_auth',JSON.stringify({name:'Demo User',provider:'demo',idToken:'demo-local-session'}));location.href='index.html'}}else{const app=initializeApp(firebaseConfig);const auth=getAuth(app);onAuthStateChanged(auth,user=>{if(user){user.getIdToken().then(idToken=>{localStorage.setItem('brandpulse_auth',JSON.stringify({name:user.displayName||'Google User',email:user.email||'',provider:'google',idToken}));location.href='index.html'}).catch(()=>{status.textContent='Could not establish the backend session.'})}});document.getElementById('google').onclick=async()=>{status.textContent='Opening Google sign-in…';try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){status.textContent=e.message||'Sign-in failed.'}}}</script></body></html>
